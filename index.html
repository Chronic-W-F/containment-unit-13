<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Containment Unit 13</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  height:230px;
  overflow:hidden;
  background:#050505;
}

header img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  border-bottom:3px solid #7a0000;
  box-shadow:0 0 25px rgba(255,0,0,.35);
}

.system-log{
  background:#050505;
  color:#39ff14;
  padding:18px;
  font-family:monospace;
  border-top:1px solid #222;
  border-bottom:1px solid #222;
  min-height:140px;
  line-height:1.55;
  box-shadow:inset 0 0 25px rgba(57,255,20,.06),0 0 20px rgba(255,0,0,.08);
  font-size:1.05rem;
}

.cursor{
  animation:blink .7s infinite;
}

@keyframes blink{
  0%,50%{opacity:1}
  51%,100%{opacity:0}
}

.main{
  padding:22px;
}

.add-unit,.unit{
  background:#0b0b0b;
  border:1px solid #2a2a2a;
  border-radius:14px;
  padding:24px;
  margin-bottom:24px;
  box-shadow:0 0 18px rgba(255,0,0,.08),inset 0 0 14px rgba(255,255,255,.02);
}

.add-unit h2,.unit h3{
  margin-top:0;
  color:#ff3a3a;
  text-shadow:0 0 8px rgba(255,0,0,.5);
}

input,textarea{
  width:100%;
  background:#151515;
  color:white;
  border:1px solid #3a3a3a;
  padding:14px;
  margin-top:12px;
  border-radius:8px;
  font-size:1rem;
}

textarea{
  resize:vertical;
}

input:focus,textarea:focus{
  outline:none;
  border-color:#a00000;
  box-shadow:0 0 10px rgba(255,0,0,.25);
}

button{
  margin-top:14px;
  background:#8b0000;
  color:white;
  border:none;
  padding:14px 18px;
  font-size:1rem;
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  background:#b30000;
  transform:scale(1.02);
}

.unit-actions,.item-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}

.small-btn{
  padding:8px 12px;
  font-size:.82rem;
  margin-top:0;
}

.edit-btn{
  background:#333;
}

.delete-btn{
  background:#400;
}

.item{
  padding:12px;
  margin-bottom:12px;
  background:#141414;
  border-left:4px solid #8b0000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-radius:6px;
}

.empty{
  color:#aaa;
  font-style:italic;
}

.footer-warning{
  text-align:center;
  padding:34px 15px;
  color:#700;
  font-size:.9rem;
  letter-spacing:4px;
}
</style>
</head>

<body>

<header>
  <img src="/publicimages/containment-unit-13.png" alt="Containment Unit 13 Banner">
</header>

<div class="system-log" id="systemLog"></div>

<div class="main">

  <div class="add-unit">

    <h2>Create New Unit</h2>

    <input
      type="text"
      id="unitName"
      placeholder="Custom Unit Name"
    >

    <textarea
      id="unitItems"
      rows="6"
      placeholder="Enter items... one per line"
    ></textarea>

    <button onclick="addUnit()">
      Create Containment Unit
    </button>

  </div>

  <div id="units"></div>

</div>

<div class="footer-warning">
CONTAINMENT DATABASE ACTIVE
</div>

<script>

let units =
  JSON.parse(
    localStorage.getItem("containmentUnits")
  ) || [];

const bootMessages = [

  "INITIALIZING CONTAINMENT DATABASE",
  "SCANNING UNIT INVENTORY",
  "VERIFYING AUTHORIZATION",
  "CHECKING BREACH HISTORY",
  "PURGE PROTOCOL STANDBY",
  "ACCESS CLEAR"

];

const systemLog =
  document.getElementById("systemLog");

async function bootSequence(){

  systemLog.innerHTML = "";

  for(const msg of bootMessages){

    const line =
      document.createElement("div");

    systemLog.appendChild(line);

    for(let dots = 1; dots <= 3; dots++){

      line.innerHTML =
        msg +
        ".".repeat(dots) +
        '<span class="cursor">█</span>';

      await wait(420);

    }

    line.innerHTML = msg + "...";

    await wait(260);

  }

  const finalLine =
    document.createElement("div");

  finalLine.innerHTML =
    '<br>SECURITY STATUS: <span style="color:#ff3333;">ARMED</span>';

  systemLog.appendChild(finalLine);

}

function wait(ms){

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );

}

function saveUnits(){

  localStorage.setItem(
    "containmentUnits",
    JSON.stringify(units)
  );

}

function renderUnits(){

  const container =
    document.getElementById("units");

  container.innerHTML = "";

  units.forEach((unit, unitIndex)=>{

    let itemsHTML = "";

    unit.items.forEach((item, itemIndex)=>{

      itemsHTML += `

        <div class="item">

          <span>${item}</span>

          <div class="item-buttons">

            <button
              class="small-btn edit-btn"
              onclick="editItem(${unitIndex}, ${itemIndex})"
            >
              EDIT
            </button>

            <button
              class="small-btn delete-btn"
              onclick="deleteItem(${unitIndex}, ${itemIndex})"
            >
              REMOVE
            </button>

          </div>

        </div>

      `;

    });

    container.innerHTML += `

      <div class="unit">

        <h3>
          Unit ${unitIndex + 1}
          — ${unit.name}
        </h3>

        <div class="unit-actions">

          <button
            class="small-btn edit-btn"
            onclick="editUnitName(${unitIndex})"
          >
            EDIT UNIT
          </button>

          <button
            class="small-btn delete-btn"
            onclick="deleteUnit(${unitIndex})"
          >
            DELETE UNIT
          </button>

        </div>

        ${itemsHTML || '<p class="empty">No items contained.</p>'}

      </div>

    `;

  });

}

function addUnit(){

  const name =
    document.getElementById("unitName")
    .value
    .trim();

  const rawItems =
    document.getElementById("unitItems")
    .value
    .trim();

  if(!name){

    alert("Containment unit name required.");

    return;

  }

  const items = rawItems
    ? rawItems
        .split("\n")
        .map(i => i.trim())
        .filter(i => i)
    : [];

  units.push({

    name,
    items

  });

  saveUnits();

  renderUnits();

  document.getElementById("unitName").value = "";
  document.getElementById("unitItems").value = "";

}

function editUnitName(unitIndex){

  const updatedName =
    prompt(
      "Edit unit name:",
      units[unitIndex].name
    );

  if(updatedName === null) return;

  if(updatedName.trim() === "") return;

  units[unitIndex].name =
    updatedName.trim();

  saveUnits();

  renderUnits();

}

function editItem(unitIndex, itemIndex){

  const currentItem =
    units[unitIndex].items[itemIndex];

  const updatedItem =
    prompt(
      "Edit item:",
      currentItem
    );

  if(updatedItem === null) return;

  if(updatedItem.trim() === "") return;

  units[unitIndex].items[itemIndex] =
    updatedItem.trim();

  saveUnits();

  renderUnits();

}

function deleteItem(unitIndex, itemIndex){

  const confirmDelete =
    confirm(
      "Remove this item from containment?"
    );

  if(!confirmDelete) return;

  units[unitIndex]
    .items
    .splice(itemIndex, 1);

  saveUnits();

  renderUnits();

}

function deleteUnit(unitIndex){

  const confirmDelete =
    confirm(
      "WARNING: Delete this entire containment unit and all items inside it?"
    );

  if(!confirmDelete) return;

  units.splice(unitIndex, 1);

  saveUnits();

  renderUnits();

}

bootSequence();

renderUnits();

</script>

</body>
</html>
