<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Containment Unit 13</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  position:relative;
}

header img{
  width:100%;
  display:block;
  border-bottom:3px solid #7a0000;
  box-shadow:0 0 25px rgba(255,0,0,.35);
}

.overlay{
  position:absolute;
  bottom:18px;
  left:18px;
  background:rgba(0,0,0,.7);
  padding:14px 18px;
  border:1px solid #700;
  box-shadow:0 0 14px rgba(255,0,0,.45);
}

.overlay h1{
  margin:0;
  color:#ff2e2e;
  font-size:2rem;
  text-shadow:0 0 12px red;
}

.overlay p{
  margin:6px 0 0;
  color:#bbb;
  font-size:.95rem;
}

.system-log{
  background:#080808;
  color:#39ff14;
  padding:14px;
  font-family:monospace;
  border-top:1px solid #222;
  border-bottom:1px solid #222;
  min-height:120px;
  line-height:1.5;
  box-shadow:inset 0 0 20px rgba(57,255,20,.08);
}

.cursor{
  animation:blink .7s infinite;
}

@keyframes blink{
  0%,50%{opacity:1}
  51%,100%{opacity:0}
}

.main{
  padding:20px;
}

.add-unit,.unit{
  background:#111;
  border:1px solid #333;
  padding:20px;
  margin-bottom:20px;
  border-radius:10px;
  box-shadow:0 0 18px rgba(255,0,0,.08);
}

h2,h3{
  color:#ff3a3a;
  margin-top:0;
}

input,textarea{
  width:100%;
  background:#1a1a1a;
  color:white;
  border:1px solid #444;
  padding:12px;
  margin-top:10px;
  border-radius:6px;
  font-size:1rem;
}

button{
  margin-top:12px;
  background:#8b0000;
  color:white;
  border:none;
  padding:12px 18px;
  font-size:1rem;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#b30000;
}

.item{
  padding:10px;
  margin-bottom:10px;
  background:#1a1a1a;
  border-left:4px solid #8b0000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.delete-btn{
  background:#400;
  padding:6px 10px;
  font-size:.8rem;
}

.footer-warning{
  text-align:center;
  padding:30px 15px;
  color:#700;
  font-size:.85rem;
  letter-spacing:2px;
}
</style>
</head>

<body>

<header>
  <img src="/publicimages/containment-unit-13.png" alt="Containment Unit 13 Banner">

  <div class="overlay">
    <h1>Containment Unit 13</h1>
    <p>Unauthorized access will be terminated.</p>
  </div>
</header>

<div class="system-log" id="systemLog"></div>

<div class="main">

  <div class="add-unit">
    <h2>Create New Unit</h2>
    <input type="text" id="unitName" placeholder="Custom Unit Name">
    <textarea id="unitItems" rows="6" placeholder="Enter items... one per line"></textarea>
    <button onclick="addUnit()">Create Containment Unit</button>
  </div>

  <div id="units"></div>

</div>

<div class="footer-warning">
CONTAINMENT DATABASE ACTIVE
</div>

<script>
let units = JSON.parse(localStorage.getItem("containmentUnits")) || [];

const bootMessages = [
  "INITIALIZING CONTAINMENT DATABASE",
  "SCANNING UNIT INVENTORY",
  "VERIFYING AUTHORIZATION",
  "CHECKING BREACH HISTORY",
  "PURGE PROTOCOL STANDBY",
  "ACCESS CLEAR"
];

const systemLog = document.getElementById("systemLog");

async function bootSequence(){
  systemLog.innerHTML = "";

  for(const msg of bootMessages){
    const line = document.createElement("div");
    systemLog.appendChild(line);

    for(let dots = 1; dots <= 3; dots++){
      line.innerHTML = msg + ".".repeat(dots) + '<span class="cursor">█</span>';
      await wait(450);
    }

    line.innerHTML = msg + "...";
    await wait(350);
  }

  const finalLine = document.createElement("div");
  finalLine.innerHTML = '<br>SECURITY STATUS: <span style="color:#ff3333;">ARMED</span>';
  systemLog.appendChild(finalLine);
}

function wait(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

function saveUnits(){
  localStorage.setItem("containmentUnits", JSON.stringify(units));
}

function renderUnits(){
  const container = document.getElementById("units");
  container.innerHTML = "";

  units.forEach((unit, unitIndex)=>{
    let itemsHTML = "";

    unit.items.forEach((item, itemIndex)=>{
      itemsHTML += `
        <div class="item">
          <span>${item}</span>
          <button class="delete-btn" onclick="deleteItem(${unitIndex}, ${itemIndex})">REMOVE</button>
        </div>
      `;
    });

    container.innerHTML += `
      <div class="unit">
        <h3>Unit ${unitIndex + 1} — ${unit.name}</h3>
        ${itemsHTML || "<p>No items contained.</p>"}
      </div>
    `;
  });
}

function addUnit(){
  const name = document.getElementById("unitName").value.trim();
  const rawItems = document.getElementById("unitItems").value.trim();

  if(!name || !rawItems){
    alert("Containment data incomplete.");
    return;
  }

  const items = rawItems
    .split("\n")
    .map(i => i.trim())
    .filter(i => i);

  units.push({ name, items });

  saveUnits();
  renderUnits();

  document.getElementById("unitName").value = "";
  document.getElementById("unitItems").value = "";
}

function deleteItem(unitIndex, itemIndex){
  units[unitIndex].items.splice(itemIndex,1);
  saveUnits();
  renderUnits();
}

bootSequence();
renderUnits();
</script>

</body>
</html>
